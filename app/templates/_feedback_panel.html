<article class="panel admin-card">
  <div class="admin-card__body">
  <div class="admin-section-heading">
    <div>
      <p class="eyebrow">Feedback</p>
      <h2>行動フィードバック</h2>
    </div>
    <p class="section-copy">検索結果から property_id を選び、`/api/v1/feedback` の疎通と canonical user_actions 連携を確認します。</p>
  </div>
  <form id="feedback-form" onsubmit="event.preventDefault();">
    <div class="grid">
      <label>
        property_id
        <input id="fb-pid" type="text" required>
      </label>
      <label>
        action
        <select id="fb-action">
          <option value="click" selected>click</option>
          <option value="detail_view">detail_view</option>
          <option value="favorite">favorite</option>
          <option value="request_button_click">request_button_click</option>
          <option value="request_complete">request_complete</option>
        </select>
      </label>
    </div>
    <div class="action-row">
      <button id="feedback-btn" type="submit">送信</button>
      <p class="search-state">検索後に上位物件を選ぶと `property_id` を自動入力します。</p>
    </div>
  </form>
  <pre id="fb-result"></pre>
  </div>
</article>
