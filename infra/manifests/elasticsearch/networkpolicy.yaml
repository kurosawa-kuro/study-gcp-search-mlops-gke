apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-kibana-policy
  namespace: search
spec:
  podSelector:
    matchExpressions:
      - key: common.k8s.elastic.co/type
        operator: In
        values:
          - elasticsearch
          - kibana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 2026-05-10 incident root cause:
    # ECK Operator (`elastic-system` ns) は ES pod の `:9200/_security/api_key`
    # を呼んで reconcile する設計。`elastic-system` を許可しないと
    # `connect: connection timed out` で reconcile が完了せず、
    # `Phase=ApplyingChanges Health=unknown` で永続的にストールする
    # (= 14h 経っても green にならない)。
    # 詳細: docs/troubleshooting/eck-license-reconcile-stall.md
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: search
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kserve-inference
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-system
      ports:
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 5601
  egress:
    - {}
