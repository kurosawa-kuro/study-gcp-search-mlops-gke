apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: search
spec:
  version: 8.13.4
  # 2026-05-10 incident root cause: canonical URL `http://...:9200` と ECK 8.x
  # の default `xpack.security.http.ssl.enabled=true` が不整合 →
  # sync-elasticsearch step が `Server disconnected` で fail。
  # (a') 解: TLS だけ無効化 (HTTP 化、canonical URL 維持) + security stack は ON
  # のまま、anonymous role で auth bypass。production 化時は HTTPS + password
  # auth へ移行 (TASKS_ROADMAP backlog)。詳細:
  # docs/troubleshooting/eck-license-reconcile-stall.md
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
        readiness.port: 9200
        # security stack は ON のまま (ECK 8.x で deprecated path を避ける)、
        # anonymous superuser で auth bypass。学習プロジェクト前提。
        xpack.security.authc.anonymous.username: anonymous_user
        xpack.security.authc.anonymous.roles: superuser
        xpack.security.authc.anonymous.authz_exception: false
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: "250m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              readinessProbe:
                tcpSocket:
                  port: 9200
                initialDelaySeconds: 10
                periodSeconds: 5
                failureThreshold: 12
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: standard
            resources:
              requests:
                storage: 20Gi
