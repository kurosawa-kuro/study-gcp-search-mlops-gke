# Single-node Elasticsearch 8 for lexical BM25 (Wave 6 dev/study path).
# Production hardening: TLS, authentication, resource sizing, PDB — backlog.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: search
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: hybrid-search
spec:
  ports:
    - port: 9200
      name: http
      targetPort: http
  selector:
    app.kubernetes.io/name: elasticsearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: search
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: hybrid-search
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: xpack.security.enabled
              value: "false"
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
